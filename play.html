<!DOCTYPE html>
<html>


    <div class="input-area">

    </div>
    <div>

    </div>
    <div class="form-oper">
      <div class="form-loop">  
            <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" >
            <label class="form-check-label" for="flexCheckChecked"><i class="bi-arrow-repeat" data-bs-toggle='tooltip' title="Loop play"></i>
            </label>
 
      </div>
      <div class="form-loop col-xs-2">
        <label class="form-check-label" for="interval_id">Interval</label>
 
          <input type="number" class="form-control input-sm" id="interval_id" value="5" min="0" max="100" step="1"/>        
          <label class="form-check-label" for="interval_id">Seconds</label>

  
      </div>
      <div class="form-loop">
        <button id="Start" type="button" class="btn btn-primary" data-bs-toggle="tooltip" title="Start"><i class="bi-play"></i></button>
        <button id="Pause" type="button" class="btn btn-primary disabled" data-bs-toggle="tooltip" title="Pause"><i class="bi-pause"></i></button>           	
        <button id="Stop" type="button" class="btn btn-primary disabled" data-bs-toggle="tooltip" title="Stop"><i class="bi-stop"></i></button>           	
      </div>
      <div class="form-loop">
        <button id="Close" type="button" class="btn btn-primary" data-bs-toggle="tooltip" title="Close session"><i class="bi-x"></i>Close</button>
      </div>
    </div>



</html>
