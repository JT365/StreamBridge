<!DOCTYPE html>
<html>
  <div class="form-fw">
    <div class="form-fw">

    </div>

    <div class="main-area">
        <div class="form-fw">
			    <div class="form-test">
            <label for="input-theme">Theme</label>
            <select id="input-theme" name="body"> </select>
          </div>
			    <div class="form-test">
            <label for="input-number">Number type</label>
            <select id="input-number" name="body"> </select>
          </div>
          <div class="form-test">
            <label for="input-pointer">Pointer type</label>
            <select id="input-pointer" name="body"> </select>
          </div>
          <div class="form-test">
            <label for="input-preset">Preset</label>
            <select id="input-preset" name="body"> </select>
          </div> 
          <div class="form-test">
            <label for="input-timezone">TimeZone</label>
            <select id="input-timezone" name="body" multiple="multiple"> </select>
          </div> 
          <div class="form-test">
            <label for="input-rotation">Rotation</label>
            <select id="input-rotation" name="body"> </select>
          </div> 
          <div class="main-area">
            <div class="form-test"> <input type="checkbox" id="SkipHourLabel"> <label for="SkipHourLabel">Skip hour label</label>
            </div>
            <div class="form-test"> <input type="checkbox" id="ZoomSecond"> <label for="ZoomSecond">Zoom second</label>
            </div>
            <div class="form-test"> <input type="checkbox" id="ShowDetailInfo"> <label for="ShowDetailInfo">Show detail</label>
            </div>
            <div class="form-test"> <input type="checkbox" id="ShowWeekDate"> <label for="ShowWeekDate">Show week</label>
            </div>
            <div class="form-test"> <input type="checkbox" id="ShowShadow"> <label for="ShowShadow">Show shadow</label>
            </div>
          </div>
          <div class="form-oper">
            <div class="form-loop">
              <button id="Start" type="button" class="btn btn-primary" data-bs-toggle="tooltip" title="Start"><i class="bi-play"></i></button>          	
              <button id="Stop" type="button" class="btn btn-primary disabled" data-bs-toggle="tooltip" title="Stop"><i class="bi-stop"></i></button>           	
            </div>
            <div class="form-loop">
              <button id="Close" type="button" class="btn btn-primary" data-bs-toggle="tooltip" title="Close session"><i class="bi-x"></i>Close</button>
            </div>
          </div>
        </div>
    </div>

  </div>
</html>
